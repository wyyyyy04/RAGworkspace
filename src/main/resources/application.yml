server:
  port: 8009

spring:
  profiles:
    # 本地敏感配置放在 application-local.yml（已 gitignore），可用环境变量覆盖
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: KnowEngine
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://127.0.0.1:3306/know_engine?rewriteBatchedStatements=true
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # druid:
    initial-size: 5
    min-idle: 5
    max-active: 20
    max-wait: 60000
    time-between-eviction-runs-millis: 60000
    min-evictable-idle-time-millis: 300000
    validation-query: SELECT 1
    test-while-idle: true
    test-on-borrow: false
    test-on-return: false
    pool-prepared-statements: true
    max-pool-prepared-statement-per-connection-size: 20
    filters: stat,wall
    connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
    stat-view-servlet:
      enabled: true
      url-pattern: /druid/*
      login-username: ${DRUID_USER:}
      login-password: ${DRUID_PASSWORD:}
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ssl:
        enabled: false
  redis:
    redisson:
      config: |
        singleServerConfig:
          idleConnectionTimeout: 10000
          connectTimeout: 10000
          timeout: 3000
          retryAttempts: 3
          retryInterval: 1500
          password: null
          subscriptionsPerConnection: 5
          clientName: null
          address: "redis://localhost:6379"
          subscriptionConnectionMinimumIdleSize: 1
          subscriptionConnectionPoolSize: 50
          connectionMinimumIdleSize: 24
          connectionPoolSize: 64
          database: 0
          dnsMonitoringInterval: 5000
        threads: 16
        nettyThreads: 32
        codec: !<org.redisson.codec.JsonJacksonCodec> {}
        transportMode: "NIO"

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mapper/**/*.xml

# 通义 DashScope API Key（兼容 OpenAI 接口），请填入你自己的密钥
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}

langchain4j:
  open-ai:
    chat-model:
      api-key: ${dashscope.api-key}
      model-name: qwen3.6-flash
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      log-requests: true
      log-responses: true
    streaming-chat-model:
      api-key: ${dashscope.api-key}
      model-name: qwen3.6-flash
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      log-requests: true
      log-responses: true

elasticsearch:
  host: http://127.0.0.1:9200
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model-name: text-embedding-v4
  api-key: ${dashscope.api-key}
  dimensions: 1536

# MinIO 两个端口不要混用：
#   --address          S3 API 端口，Java SDK / 预签名 URL 必须走这个
#   --console-address  控制台 Web UI，只能浏览器打开，不能给 MinioClient 用
# 启动命令：.\minio.exe server "D:\soft\minio\data" --address "127.0.0.1:9090" --console-address "127.0.0.1:9000"
# http://127.0.0.1:9000/browser 可访问Web控制台
minio:
  url: http://127.0.0.1:9090
  accessKey: ${MINIO_ACCESS_KEY:}
  secretKey: ${MINIO_SECRET_KEY:}
  bucketName: know-engine # 默认是这个,可以不改
  endpoint: http://127.0.0.1:9090 # 必须指向 --address（S3 API），不是控制台端口

# 文件解析服务配置（MinerU 4.x Tasks API）
file:
  parse:
    api:
      url: http://localhost:8000 # 文档解析服务地址，记得改成你自己的
      # 服务端通过 --api-key 启动时填写；留空表示不鉴权
      apiKey: ${MINERU_API_KEY:}
      # 建连超时（毫秒）
      connectTimeout: 30000
      # 创建任务、轮询状态的响应超时（毫秒）
      responseTimeout: 30000
      # 上传源文件的响应超时（毫秒）
      uploadTimeout: 600000
      # 下载解析产物的响应超时（毫秒）
      downloadTimeout: 300000
      # 轮询任务状态的间隔（毫秒）
      pollInterval: 2000
      # 整个任务等待上限（毫秒），默认 30 分钟
      parseTimeout: 1800000
      # PDF/图片档位：flash / basic / standard / advanced；留空由服务端按支持顺序选择
      tier: standard
      # auto / txt / ocr
      ocrMode: auto
      # 页码范围，如 1-5,8,r3-r1 或 all；留空表示全部
      pageRange:
      # 产物格式，逗号分隔：default / docx / html / latex；必须包含 default（下游按 ZIP 中的 markdown.md 处理）
      outputFormats: default